<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Finance Tools - Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: {50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'} } } } }
    </script>
    <style>
        [x-cloak]{display:none!important}
        .fade-in{animation:fadeIn .2s ease-in}
        @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen" x-data="app()" x-init="init()">

<!-- =================== LOGIN PAGE =================== -->
<template x-if="page==='login'">
<div class="min-h-screen flex items-center justify-center p-4 relative">
    <div class="absolute inset-0 opacity-5" style="background-image:radial-gradient(circle at 1px 1px,white 1px,transparent 0);background-size:40px 40px"></div>
    <div class="relative w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg shadow-blue-600/20">
                <i data-lucide="receipt" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">AR Finance Tools</h1>
            <p class="text-gray-400 text-sm mt-1">PT. DMX Trading Indonesia</p>
        </div>
        <div class="bg-gray-800 rounded-2xl shadow-xl border border-gray-700 p-8">
            <h2 class="text-xl font-semibold text-white mb-1">Masuk ke Akun</h2>
            <p class="text-gray-400 text-sm mb-6">Gunakan akun yang telah terdaftar</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input type="email" class="w-full pl-10 pr-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" placeholder="email@dmx.co.id">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                    <div class="relative" x-data="{show:false}">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input :type="show?'text':'password'" class="w-full pl-10 pr-10 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" placeholder="Masukkan password">
                        <button type="button" @click="show=!show" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300"><i data-lucide="eye" class="w-4 h-4"></i></button>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" class="w-4 h-4 rounded bg-gray-700 border-gray-600 text-blue-600">
                    <span class="text-sm text-gray-400">Ingat saya</span>
                </div>
                <button @click="page='dashboard';setTimeout(()=>{lucide.createIcons();renderCharts()},100)" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors">Masuk</button>
            </div>
        </div>
        <p class="text-center text-gray-500 text-xs mt-6">AR Finance Tools v1.0 &copy; 2026</p>
    </div>
</div>
</template>

<!-- =================== MAIN APP =================== -->
<template x-if="page!=='login'">
<div class="flex min-h-screen">
    <!-- SIDEBAR -->
    <aside class="fixed top-0 left-0 z-40 h-full bg-gray-800 border-r border-gray-700 transition-all duration-300" :class="(sidebarExpanded || sidebarLocked)?'w-64':'w-20'" @mouseenter="if(!sidebarLocked) sidebarExpanded=true" @mouseleave="if(!sidebarLocked) sidebarExpanded=false">
        <div class="flex items-center gap-3 px-4 h-16 border-b border-gray-700">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0"><i data-lucide="receipt" class="w-6 h-6 text-white"></i></div>
            <div x-show="sidebarExpanded" x-transition><h1 class="font-bold text-sm whitespace-nowrap">AR Finance Tools</h1><p class="text-xs text-gray-400 whitespace-nowrap">PT. DMX Trading</p></div>
        </div>
        <nav class="p-3 space-y-1 overflow-y-auto" style="max-height:calc(100vh - 180px)">
            <template x-for="item in navGroups" :key="item.id">
                <div>
                    <!-- Group with children -->
                    <template x-if="item.children">
                        <div>
                            <button @click="openGroup = openGroup === item.id ? null : item.id" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors" :class="item.children.some(c => c.id === page) ? 'bg-blue-900/30 text-blue-400' : 'text-gray-300 hover:bg-gray-700'">
                                <i :data-lucide="item.icon" class="w-5 h-5 flex-shrink-0"></i>
                                <span x-show="sidebarExpanded" x-transition class="whitespace-nowrap flex-1 text-left" x-text="item.label"></span>
                                <i x-show="sidebarExpanded" :data-lucide="openGroup === item.id ? 'chevron-up' : 'chevron-down'" class="w-4 h-4 flex-shrink-0"></i>
                            </button>
                            <div x-show="openGroup === item.id && sidebarExpanded" x-transition class="ml-5 mt-0.5 space-y-0.5 border-l border-gray-700 pl-3">
                                <template x-for="child in item.children" :key="child.id">
                                    <button @click="page=child.id;setTimeout(()=>lucide.createIcons(),100)" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm transition-colors" :class="page===child.id?'bg-blue-900/30 text-blue-400':'text-gray-400 hover:bg-gray-700 hover:text-gray-200'">
                                        <i :data-lucide="child.icon" class="w-4 h-4 flex-shrink-0"></i>
                                        <span class="whitespace-nowrap" x-text="child.label"></span>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </template>
                    <!-- Single item -->
                    <template x-if="!item.children">
                        <button @click="page=item.id;setTimeout(()=>{lucide.createIcons();if(item.id==='dashboard')renderCharts()},100)" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors" :class="page===item.id?'bg-blue-900/30 text-blue-400':'text-gray-300 hover:bg-gray-700'">
                            <i :data-lucide="item.icon" class="w-5 h-5 flex-shrink-0"></i>
                            <span x-show="sidebarExpanded" x-transition class="whitespace-nowrap" x-text="item.label"></span>
                        </button>
                    </template>
                </div>
            </template>
            <div x-show="sidebarExpanded" class="pt-3 pb-1 px-3"><p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Admin</p></div>
            <template x-for="item in adminNav" :key="item.id">
                <button @click="page=item.id;setTimeout(()=>lucide.createIcons(),100)" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors" :class="page===item.id?'bg-blue-900/30 text-blue-400':'text-gray-300 hover:bg-gray-700'">
                    <i :data-lucide="item.icon" class="w-5 h-5 flex-shrink-0"></i>
                    <span x-show="sidebarExpanded" x-transition class="whitespace-nowrap" x-text="item.label"></span>
                </button>
            </template>
        </nav>
        <div class="absolute bottom-0 left-0 right-0 p-3 border-t border-gray-700 bg-gray-800">
            <button @click="sidebarLocked=!sidebarLocked" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors" :class="sidebarLocked?'text-blue-400 bg-blue-900/30':'text-gray-400 hover:bg-gray-700'">
                <i :data-lucide="sidebarLocked?'lock':'unlock'" class="w-5 h-5 flex-shrink-0"></i>
                <span x-show="sidebarExpanded || sidebarLocked" x-transition class="whitespace-nowrap" x-text="sidebarLocked?'Kunci Sidebar':'Buka Sidebar'"></span>
            </button>
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-blue-900 rounded-full flex items-center justify-center flex-shrink-0"><span class="text-sm font-semibold text-blue-400">H</span></div>
                <div x-show="sidebarExpanded" x-transition class="overflow-hidden flex-1 min-w-0"><p class="text-sm font-medium truncate">Hengki</p><p class="text-xs text-gray-400">Admin</p></div>
                <button x-show="sidebarExpanded" @click="page='login'" class="p-1.5 text-gray-400 hover:text-red-500 rounded-lg hover:bg-gray-700 transition-colors"><i data-lucide="log-out" class="w-4 h-4"></i></button>
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="flex-1 transition-all duration-300" :class="(sidebarExpanded || sidebarLocked)?'ml-64':'ml-20'">
        <!-- TOPBAR -->
        <header class="sticky top-0 z-30 bg-gray-800/80 backdrop-blur-sm border-b border-gray-700">
            <div class="flex items-center justify-between h-16 px-6">
                <div><h2 class="text-lg font-semibold" x-text="pageTitle"></h2></div>
                <div class="flex items-center gap-2">
                    <button @click="darkMode=!darkMode" class="p-2 rounded-lg hover:bg-gray-700 transition-colors"><i data-lucide="moon" class="w-5 h-5"></i></button>
                    <button class="relative p-2 rounded-lg hover:bg-gray-700 transition-colors"><i data-lucide="bell" class="w-5 h-5"></i><span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
                </div>
            </div>
        </header>
        <main class="p-6 fade-in">

<!-- =================== DASHBOARD =================== -->
<template x-if="page==='dashboard'">
<div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-gray-800 rounded-xl border border-gray-700 px-5 py-4"><div class="flex items-center justify-between"><div class="min-w-0"><p class="text-xs text-gray-400">Total AR</p><p class="text-xl font-bold">Rp 24.5M</p><div class="flex items-center gap-1 mt-1"><i data-lucide="trending-down" class="w-3 h-3 text-green-500"></i><span class="text-xs text-green-500 font-medium">-5.2%</span></div></div><div class="w-10 h-10 bg-blue-900/30 rounded-lg flex items-center justify-center flex-shrink-0 ml-3"><i data-lucide="wallet" class="w-5 h-5 text-blue-400"></i></div></div></div>
        <div class="bg-gray-800 rounded-xl border border-gray-700 px-5 py-4"><div class="flex items-center justify-between"><div class="min-w-0"><p class="text-xs text-gray-400">Outstanding</p><p class="text-xl font-bold">Rp 8.75M</p><div class="flex items-center gap-1 mt-1"><i data-lucide="alert-triangle" class="w-3 h-3 text-yellow-500"></i><span class="text-xs text-yellow-500 font-medium">35.7%</span></div></div><div class="w-10 h-10 bg-yellow-900/30 rounded-lg flex items-center justify-center flex-shrink-0 ml-3"><i data-lucide="clock" class="w-5 h-5 text-yellow-400"></i></div></div></div>
        <div class="bg-gray-800 rounded-xl border border-gray-700 px-5 py-4"><div class="flex items-center justify-between"><div class="min-w-0"><p class="text-xs text-gray-400">Overdue (&gt;90h)</p><p class="text-xl font-bold">Rp 2.1M</p><div class="flex items-center gap-1 mt-1"><i data-lucide="trending-up" class="w-3 h-3 text-red-500"></i><span class="text-xs text-red-500 font-medium">+2.1%</span></div></div><div class="w-10 h-10 bg-red-900/30 rounded-lg flex items-center justify-center flex-shrink-0 ml-3"><i data-lucide="alert-circle" class="w-5 h-5 text-red-400"></i></div></div></div>
        <div class="bg-gray-800 rounded-xl border border-gray-700 px-5 py-4"><div class="flex items-center justify-between"><div class="min-w-0"><p class="text-xs text-gray-400">Collection Rate</p><p class="text-xl font-bold">87.3%</p><div class="flex items-center gap-1 mt-1"><i data-lucide="trending-up" class="w-3 h-3 text-green-500"></i><span class="text-xs text-green-500 font-medium">+1.8%</span></div></div><div class="w-10 h-10 bg-green-900/30 rounded-lg flex items-center justify-center flex-shrink-0 ml-3"><i data-lucide="percent" class="w-5 h-5 text-green-400"></i></div></div></div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-5 lg:col-span-2">
            <div class="flex items-center justify-between mb-4"><h3 class="font-semibold">Aging Distribution</h3><select class="text-sm bg-gray-700 border-0 rounded-lg px-3 py-1.5"><option>Bulan Ini</option></select></div>
            <div style="height:220px;max-height:220px"><canvas id="agingChart"></canvas></div>
        </div>
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-5">
            <h3 class="font-semibold mb-4">Status Koleksi</h3>
            <div style="height:220px;max-height:220px"><canvas id="statusChart"></canvas></div>
            <div class="mt-4 space-y-2">
                <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="w-3 h-3 bg-green-500 rounded-full"></span> Settled</span><span class="font-medium">64.3%</span></div>
                <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="w-3 h-3 bg-yellow-500 rounded-full"></span> In Progress</span><span class="font-medium">21.5%</span></div>
                <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="w-3 h-3 bg-red-500 rounded-full"></span> Overdue</span><span class="font-medium">14.2%</span></div>
            </div>
        </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-5">
            <h3 class="font-semibold mb-4">Aktivitas Terbaru</h3>
            <div class="space-y-3">
                <div class="flex items-start gap-3 p-3 bg-gray-700/50 rounded-lg"><div class="w-8 h-8 bg-green-900/30 rounded-full flex items-center justify-center flex-shrink-0"><i data-lucide="check-circle" class="w-4 h-4 text-green-500"></i></div><div><p class="text-sm">Invoice <strong>INV-2026-0847</strong> telah dibayar</p><p class="text-xs text-gray-400 mt-0.5">PT. Maju Jaya • 5 menit lalu</p></div></div>
                <div class="flex items-start gap-3 p-3 bg-gray-700/50 rounded-lg"><div class="w-8 h-8 bg-yellow-900/30 rounded-full flex items-center justify-center flex-shrink-0"><i data-lucide="send" class="w-4 h-4 text-yellow-500"></i></div><div><p class="text-sm">Reminder terkirim ke <strong>PT. Sukses Abadi</strong></p><p class="text-xs text-gray-400 mt-0.5">Email + WhatsApp • 15 menit lalu</p></div></div>
                <div class="flex items-start gap-3 p-3 bg-gray-700/50 rounded-lg"><div class="w-8 h-8 bg-red-900/30 rounded-full flex items-center justify-center flex-shrink-0"><i data-lucide="alert-triangle" class="w-4 h-4 text-red-500"></i></div><div><p class="text-sm">Credit limit <strong>PT. Makmur</strong> melebihi 95%</p><p class="text-xs text-gray-400 mt-0.5">Auto-escalate ke Finance Manager • 2 jam lalu</p></div></div>
            </div>
        </div>
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-5">
            <h3 class="font-semibold mb-4">Aksi Cepat</h3>
            <div class="grid grid-cols-2 gap-3">
                <button @click="page='exclusions';setTimeout(()=>lucide.createIcons(),100)" class="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg hover:bg-gray-700 transition-colors"><i data-lucide="shield-x" class="w-5 h-5 text-blue-400"></i><span class="text-sm font-medium">Exclusion List</span></button>
                <button @click="page='aging';setTimeout(()=>{lucide.createIcons();renderAgingChart()},100)" class="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg hover:bg-gray-700 transition-colors"><i data-lucide="calendar-clock" class="w-5 h-5 text-yellow-400"></i><span class="text-sm font-medium">Generate Aging</span></button>
                <button @click="page='reconciliation';setTimeout(()=>lucide.createIcons(),100)" class="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg hover:bg-gray-700 transition-colors"><i data-lucide="git-compare-arrows" class="w-5 h-5 text-green-400"></i><span class="text-sm font-medium">Reconciliation</span></button>
                <button @click="page='reminders';setTimeout(()=>lucide.createIcons(),100)" class="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg hover:bg-gray-700 transition-colors"><i data-lucide="bell-ring" class="w-5 h-5 text-red-400"></i><span class="text-sm font-medium">Kirim Reminder</span></button>
                <button @click="page='credit';setTimeout(()=>lucide.createIcons(),100)" class="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg hover:bg-gray-700 transition-colors"><i data-lucide="credit-card" class="w-5 h-5 text-purple-400"></i><span class="text-sm font-medium">Credit Monitor</span></button>
                <button @click="page='tracker';setTimeout(()=>lucide.createIcons(),100)" class="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg hover:bg-gray-700 transition-colors"><i data-lucide="target" class="w-5 h-5 text-orange-400"></i><span class="text-sm font-medium">Collection Tracker</span></button>
            </div>
        </div>
    </div>
</div>
</template>

<!-- =================== EXCLUSIONS =================== -->
<template x-if="page==='exclusions'">
<div>
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div><h1 class="text-xl font-bold">Invoice Exclusion / Blacklist</h1><p class="text-sm text-gray-400">Kelola daftar invoice yang dikecualikan dari pengiriman reminder</p></div>
        <div class="flex gap-2">
            <button class="inline-flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium"><i data-lucide="upload" class="w-4 h-4"></i> Bulk Import</button>
            <button class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium"><i data-lucide="plus" class="w-4 h-4"></i> Tambah</button>
        </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-4"><p class="text-sm text-gray-400">Total Exclusions</p><p class="text-2xl font-bold mt-1">127</p></div>
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-4"><p class="text-sm text-gray-400">Active</p><p class="text-2xl font-bold mt-1 text-green-600">98</p></div>
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-4"><p class="text-sm text-gray-400">Reverted</p><p class="text-2xl font-bold mt-1 text-gray-400">29</p></div>
    </div>
    <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-700/50"><tr>
                    <th class="text-left px-4 py-3 font-medium">Invoice No</th><th class="text-left px-4 py-3 font-medium">Customer</th><th class="text-right px-4 py-3 font-medium">Amount</th><th class="text-left px-4 py-3 font-medium">Alasan</th><th class="text-left px-4 py-3 font-medium">Status</th><th class="text-left px-4 py-3 font-medium">Date</th><th class="text-right px-4 py-3 font-medium">Aksi</th>
                </tr></thead>
                <tbody class="divide-y divide-gray-700">
                    <tr class="hover:bg-gray-700/30"><td class="px-4 py-3 font-mono text-xs">INV-2026-0847</td><td class="px-4 py-3">PT. Maju Jaya</td><td class="px-4 py-3 text-right font-medium">Rp 45.5M</td><td class="px-4 py-3"><span class="px-2 py-1 bg-yellow-900/30 text-yellow-400 rounded-full text-xs">Dispute</span></td><td class="px-4 py-3"><span class="px-2 py-1 bg-green-900/30 text-green-400 rounded-full text-xs">Active</span></td><td class="px-4 py-3 text-gray-400">2026-08-20</td><td class="px-4 py-3 text-right"><button class="text-gray-400 hover:text-red-500"><i data-lucide="undo-2" class="w-4 h-4"></i></button></td></tr>
                    <tr class="hover:bg-gray-700/30"><td class="px-4 py-3 font-mono text-xs">INV-2026-0832</td><td class="px-4 py-3">PT. Sukses Abadi</td><td class="px-4 py-3 text-right font-medium">Rp 128.7M</td><td class="px-4 py-3"><span class="px-2 py-1 bg-red-900/30 text-red-400 rounded-full text-xs">Cancelled</span></td><td class="px-4 py-3"><span class="px-2 py-1 bg-green-900/30 text-green-400 rounded-full text-xs">Active</span></td><td class="px-4 py-3 text-gray-400">2026-08-18</td><td class="px-4 py-3 text-right"><button class="text-gray-400 hover:text-red-500"><i data-lucide="undo-2" class="w-4 h-4"></i></button></td></tr>
                    <tr class="hover:bg-gray-700/30"><td class="px-4 py-3 font-mono text-xs">INV-2026-0819</td><td class="px-4 py-3">PT. Makmur Sejahtera</td><td class="px-4 py-3 text-right font-medium">Rp 67.2M</td><td class="px-4 py-3"><span class="px-2 py-1 bg-blue-900/30 text-blue-400 rounded-full text-xs">Duplicate</span></td><td class="px-4 py-3"><span class="px-2 py-1 bg-gray-600 text-gray-300 rounded-full text-xs">Reverted</span></td><td class="px-4 py-3 text-gray-400">2026-08-15</td><td class="px-4 py-3 text-right">-</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</template>

<!-- =================== CUSTOMER =================== -->
<template x-if="page==='customers'">
<div>
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div><h1 class="text-xl font-bold">Data Customer</h1><p class="text-sm text-gray-400">Kelola data master customer</p></div>
        <div class="flex gap-2">
            <button class="inline-flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium"><i data-lucide="upload" class="w-4 h-4"></i> Import</button>
            <button class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium"><i data-lucide="plus" class="w-4 h-4"></i> Tambah Customer</button>

                { id: 'customers', label: 'Customer', icon: 'users' },
                { id: 'exclusions', label: 'Invoice Exclusion', icon: 'shield-x' },
                { id: 'import-accurate', label: 'Import Laporan Accurate', icon: 'file-spreadsheet' },
            ]},
            { id: 'aging', label: 'Aging Report', icon: 'calendar-clock' },
            { id: 'reconciliation', label: 'AR Reconciliation', icon: 'git-compare-arrows' },
            { id: 'reminders', label: 'Reminders', icon: 'bell-ring' },
            { id: 'credit', label: 'Credit Monitor', icon: 'credit-card' },

            { id: 'tracker', label: 'Collection Tracker', icon: 'target' },
        ],
        adminNav: [
            { id: 'users', label: 'Users', icon: 'users' },
            { id: 'audit', label: 'Audit Log', icon: 'scroll-text' },
            { id: 'settings', label: 'Settings', icon: 'settings' },
        ],
        get pageTitle() {
            const titles = { dashboard:'Dashboard', customers:'Customer', exclusions:'Invoice Exclusion', 'import-accurate':'Import Laporan Accurate', aging:'Aging Report', reconciliation:'AR Reconciliation', reminders:'Reminders', credit:'Credit Monitor', analyzer:'Customer Analyzer', tracker:'Collection Tracker', users:'User Management', audit:'Audit Log', settings:'System Settings' };
            return titles[this.page] || 'Dashboard';
        },
        init() {
            setTimeout(() => lucide.createIcons(), 200);
        },
        renderCharts() {
            setTimeout(() => {
                const agingCtx = document.getElementById('agingChart');
                if (agingCtx && !agingCtx._chart) {
                    agingCtx._chart = new Chart(agingCtx, {
                        type: 'bar',
                        data: { labels: ['Current (0-30)', '31-60 hari', '61-90 hari', '> 90 hari'], datasets: [{ label: 'Miliar Rp', data: [15.2, 4.8, 2.4, 2.1], backgroundColor: ['#22c55e','#eab308','#f97316','#ef4444'], borderRadius: 8, barThickness: 40 }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(156,163,175,0.1)' } }, x: { grid: { display: false } } } }
                    });
                }
                const statusCtx = document.getElementById('statusChart');
                if (statusCtx && !statusCtx._chart) {
                    statusCtx._chart = new Chart(statusCtx, {
                        type: 'doughnut',
                        data: { labels: ['Settled','In Progress','Overdue'], datasets: [{ data: [64.3,21.5,14.2], backgroundColor: ['#22c55e','#eab308','#ef4444'], borderWidth: 0, cutout: '70%' }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                }
                lucide.createIcons();
            }, 100);
        },
        renderAgingChart() {
            setTimeout(() => {
                const el = document.getElementById('agingReportChart');
                if (el && !el._chart) {
                    el._chart = new Chart(el, {
                        type: 'bar',
